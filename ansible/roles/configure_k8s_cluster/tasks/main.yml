---
# tasks file for configure_k8s_cluster
# - name: Check if cluster is already initialiezd
#  # when: inventory_hostname in groups['control_plane_prx']
#   ansible.builtin.shell: kubectl get nodes
#   register: cluster_status
#   ignore_errors: true

- block:
    - name: Initialize k8s cluster
      when: inventory_hostname in groups['control_plane']
      ansible.builtin.shell: kubeadm init --pod-network-cidr={{ pod_cidr }} --kubernetes-version {{ k8s_version }}
      register: kubeadm_init
      become: true

    - name: Print out output of kubeadm init
      ansible.builtin.debug:
        var: kubeadm_init
 
    - name: Register output of token list
      when: inventory_hostname in groups['control_plane']
      ansible.builtin.shell: kubeadm token list
      register: token_list
      become: true

    - name: Print out token list
      ansible.builtin.debug:
        var: token_list

    - name: Create .kube dir
      ansible.builtin.file:
        path: "{{ ansible_home }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        mode: "0764"
      become: true  

    - name: Generate & save join command
      when: inventory_hostname in groups['control_plane']
      ansible.builtin.shell: kubeadm token create --print-join-command > "{{ ansible_home }}/.kube/join_cluster"
      become: true

    - name: Fetch join command to /tmp
      when: inventory_hostname in groups['control_plane']  
      ansible.builtin.fetch:
        src: "{{ ansible_home }}/.kube/join_cluster"
        dest: /tmp/join_cluster
        flat: true
      become: true  
        
    - name: Copy kube config to ./kube
      when: inventory_hostname in groups['control_plane']
      ansible.builtin.copy:
        src: "{{ kubernetes_folder }}/admin.conf"
        dest: "{{ ansible_home }}/.kube/config"
        owner: "{{ ansible_user }}"
        mode: '0644'
        remote_src: true
      become: true  

    - name: CHeck if ~/.kube folder exist on localhost
      delegate_to: localhost
      ansible.builtin.stat:
        path: "/home/{{ home_owner }}/.kube"
      register: dir
      become: false
      vars:
        ansible_connection: local
        ansible_become: false

    - name: Create ~/.kube if not exist on localhost
      delegate_to: localhost
      ansible.builtin.file:
        state: directory
        path: "/home/{{ home_owner }}/.kube"
        mode: '0755'
      vars:
        ansible_connection: local
        ansible_become: false 

    - name: Copy kube config to localhost
      when: inventory_hostname in groups['control_plane']
      ansible.builtin.fetch:     
        src: "{{ kubernetes_folder }}/admin.conf"
        dest: "/home/{{ home_owner }}/.kube/admin_{{ inventory_hostname }}.conf"
        owner: "{{ home_owner }}"
        mode: '0644'
        flat: true

    - name: Deploy calico CNI plugin 
      when: inventory_hostname in groups['control_plane']
      ansible.builtin.shell: sudo -u {{ ansible_user }} kubectl apply -f {{ calico_url }} 
      register: calico_output
      become: true

    - name: Print out calico 
      ansible.builtin.debug:
        var: calico_output 

    - name: Copy join command to worker nodes
      when: inventory_hostname in groups['workers']
      ansible.builtin.copy:
        src: /tmp/join_cluster
        dest: "{{ ansible_home }}/.kube/join_cluster"
        owner: "{{ ansible_user }}"
        mode: "0744"

    - name: Join worker nodes to cluster
      when: inventory_hostname in groups['workers']
      ansible.builtin.shell: /bin/sh {{ ansible_home }}/.kube/join_cluster
      register: join_output
      become: true

    - name: Print output of join command
      ansible.builtin.debug:
        var: join_output  

