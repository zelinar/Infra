---
# tasks file for create_api_user_packer
    - name: Create packer API user
      ansible.builtin.command: /usr/sbin/pveum user add packer@pve -comment "API user for Packer"
        
    - name: Createa a group
      ansible.builtin.command: /usr/sbin/pveum group add packer-group -comment "Group for Packer API users" 

    - name: Create role with necessary privileges
      ansible.builtin.command: /usr/sbin/pveum role add packer-role -privs "Datastore.AllocateSpace Datastore.Audit Pool.Allocate Sys.Audit Sys.Console Sys.Modify VM.Allocate VM.Audit VM.Clone VM.Config.CDROM VM.Config.CPU VM.Config.Cloudinit VM.Config.Disk VM.Config.HWType VM.Config.Memory VM.Config.Network VM.Config.Options VM.Migrate VM.Monitor VM.PowerMgmt SDN.Use"

    - name: Associate group and role
      ansible.builtin.command: /usr/sbin/pveum user modify packer@pve -group packer-group
    
    - name: Assign role to Terraform group
      ansible.builtin.command: /usr/sbin/pveum acl modify / -group packer-group -role packer-role

    - name: Assign perm to node
      ansible.builtin.command: /usr/sbin/pveum acl modify /nodes/homelab-server -group packer-group -role packer-role  

    - name: Assign perm for VM-storage
      ansible.builtin.command: /usr/sbin/pveum aclmod /storage/VM-storage -group packer-group -role packer-role

    - name: Create API token for Terraform user
      ansible.builtin.command: /usr/sbin/pveum user token add packer@pve packer-token --privsep 1
      register: token_output            

    - name: Display token secret (save this!)
      ansible.builtin.debug:
        msg: "Terraform API Token created. Save this secret: {{ token_output.stdout }}" 