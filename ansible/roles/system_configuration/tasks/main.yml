---
# tasks file for system_configuration
- block:
    - name: Load kernel modules immidietly
      ansible.builtin.command:
        cmd: modprobe {{ item }}
      with_items:
        - br_netfilter
        - overlay

    - name: Ensure modules are loaded on boot
      ansible.builtin.copy:
        dest: "{{ modules_conf }}"
        content: |
          br_netfilter
          overlay
        mode: '0644'

    - name: Persist sysctl settings for Kubernetes networking
      ansible.builtin.copy:
        dest: "{{ network_conf }}"
        content: |
          net.bridge.bridge-nf-call-ip6tables = 1
          net.bridge.bridge-nf-call-iptables = 1
          net.ipv4.ip_forward
        mode: '0644'
        notify:
        - apply sysctl
  become: true          
