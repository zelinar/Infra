- name: Install and configure the kubernetes cluster on linux nodes
  hosts: control_plane_prx_02, workers_prx_02
  gather_facts: true
  roles:
    - name: Install prerequisites
      role: install_prerequisites 

    # - name: Install checkm sw version
    #   role: check_sw_versions

    - name: Set hostnames
      role: set_hostname
      
    - name: Configure /etc/hosts file
      role: configure_hosts_file
           
    - name: Sys config
      role: system_configuration
      
    - name: Install container runtime 
      role: install_containerd 
      
    - name: Install kubernetes packages, kublet,kubeadm,kubectl
      role: install_k8s_components
      tags: [test]

    - name: Initialize k8s cluster
      role: configure_k8s_cluster   

    - name: Deply clsuter addons
      role: deploy_cluster_addons
      tags: [addons]  
      
